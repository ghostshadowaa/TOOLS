services:
  - type: web
    name: shadow-tools
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 30
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: COOKIE_SECURE
        value: "1"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DASHBOARD_TOKEN
        generateValue: true
